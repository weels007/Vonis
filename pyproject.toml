[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vonis"
version = "0.1.0"
description = "Vonis — on-chain dispute court for autonomous agents (GenLayer Intelligent Contract)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "genlayer-test==0.29.2",
    "pytest>=8.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
