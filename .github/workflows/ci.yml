name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "genlayer-test==0.29.2" "pytest>=8"

      - name: Byte-compile contract sources
        run: python -m compileall -q contracts

      - name: Direct-mode contract tests
        run: pytest -q
