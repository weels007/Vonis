name: ci

on:
  push:
  pull_request:

env:
  # genlayer-test 0.29.2 loads the GenVM SDK before injecting the message
  # context on the v0.3 line; v0.2.16 (the tool's own fallback) works.
  GENVM_VERSION: v0.2.16

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "genlayer-test==0.29.2" "pytest>=8"

      - name: Cache GenVM runner bundle
        id: genvm-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-${{ runner.os }}-${{ env.GENVM_VERSION }}

      - name: Prefetch GenVM runner bundle
        if: steps.genvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          OUT="$HOME/.cache/gltest-direct/genvm-universal-${GENVM_VERSION}.tar.xz"
          BASE="https://github.com/genlayerlabs/genvm/releases/download/${GENVM_VERSION}"
          curl -fL --retry 3 --retry-delay 2 -o "$OUT" "$BASE/genvm-runners-all.tar.xz" \
            || curl -fL --retry 3 --retry-delay 2 -o "$OUT" "$BASE/genvm-universal.tar.xz"

      - name: Byte-compile contract sources
        run: python -m compileall -q contracts

      - name: Direct-mode contract tests
        run: pytest -x --tb=long -q
