name: studionet

on:
  workflow_dispatch:
    inputs:
      run_adjudication:
        description: "Run the real LLM dispute path (takes several minutes)"
        type: boolean
        default: true

  push:
    branches: [main]
    # A live run costs real web and LLM consensus, so only changed inputs
    # start one. Docs-only commits stay cheap.
    paths:
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/studionet.yml"

concurrency:
  group: studionet-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-and-test:
    # Manual runs always execute; pushes only when the commit asks for it.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[studionet]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: ~/.cache/genvm-linter
          key: genvm-linter-v0.2.16

      # The header pins a runner hash; this prints the hash the release bundle
      # ships, so a mismatch on "invalid_contract" is readable from the log.
      - name: Resolve the py-genlayer runner hash
        continue-on-error: true
        env:
          GENVM_VERSION: v0.2.16
          GENVM_REPO: genlayerlabs/genvm
        run: |
          python -m pip install --quiet genvm-linter
          python scripts/runner-hash.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy and test on Studionet
        env:
          TEST1_KEYSTORE: ${{ secrets.VONIS_TESTER1_KEYSTORE || secrets.VONIS_TEST1_KEYSTORE || secrets.VONIS_KEYSTORE_JSON || secrets.TESTER1_KEYSTORE || secrets.CLAUSEGUARD_TESTER1_KEYSTORE }}
          TEST1_PASSWORD: ${{ secrets.VONIS_TESTER1_PASSWORD || secrets.VONIS_TEST1_PASSWORD || secrets.VONIS_KEYSTORE_PASSWORD || secrets.TESTER1_PASSWORD || secrets.CLAUSEGUARD_TESTER1_PASSWORD }}
          TEST2_KEYSTORE: ${{ secrets.VONIS_TESTER2_KEYSTORE || secrets.VONIS_TEST2_KEYSTORE || secrets.TESTER2_KEYSTORE || secrets.CLAUSEGUARD_TESTER2_KEYSTORE }}
          TEST2_PASSWORD: ${{ secrets.VONIS_TESTER2_PASSWORD || secrets.VONIS_TEST2_PASSWORD || secrets.TESTER2_PASSWORD || secrets.CLAUSEGUARD_TESTER2_PASSWORD }}
          RUN_ADJUDICATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_adjudication) && '1' || (contains(github.event.head_commit.message, '[adjudication]') && '1') || '0' }}
        run: node scripts/studionet.mjs

      # Studionet state is temporary and every run deploys its own contract, so
      # the frontend constant has to follow the newest address; the commit only
      # touches src/, which the live workflow's path filter ignores.
      - name: Record the deployed address
        run: node scripts/record-address.mjs

      - name: Commit the address
        run: |
          if git diff --quiet -- src/lib/genlayer.ts; then
            echo "the frontend already points at this deployment"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/genlayer.ts
          git commit -m "Record Studionet deployment ${CONTRACT_ADDRESS} in the frontend"
          git push
